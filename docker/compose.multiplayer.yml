services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/sakurazuk/immortality:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      GAME_SERVER_INTERNAL_URL: http://game-server:3201
    ports:
      - "3000:3000"
    depends_on:
      - redis

  game-server:
    image: ${GAME_SERVER_IMAGE:-ghcr.io/sakurazuk/immortality-game-server:latest}
    build:
      context: ..
      dockerfile: docker/game-server.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      GAME_SERVER_HOST: 0.0.0.0
      GAME_SERVER_PORT: 3201
      GAME_SERVER_PUBLIC_ADDRESS: ${GAME_SERVER_PUBLIC_ADDRESS:-}
      GAME_WEB_INTERNAL_URL: ${GAME_WEB_INTERNAL_URL:-http://web:3000}
    ports:
      - "3201:3201"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
