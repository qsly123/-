name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sakurazuk/immortality
  GAME_SERVER_IMAGE_NAME: sakurazuk/immortality-game-server
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://placeholder:placeholder@127.0.0.1:5432/placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Game server smoke
        run: bun run game:smoke

      - name: Build web
        if: github.event_name == 'pull_request'
        run: bun run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.event_name != 'pull_request'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract web metadata (tags, labels)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract game-server metadata (tags, labels)
        id: meta_game_server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GAME_SERVER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}-web
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-web
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push game-server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/game-server.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_game_server.outputs.tags }}
          labels: ${{ steps.meta_game_server.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}-game-server
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-game-server
          github-token: ${{ secrets.GITHUB_TOKEN }}
