<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="robots" content="noindex" />
    <title>暂离灵虚 | 灵虚·长生录</title>
    <style>
      :root {
        color-scheme: dark;

        /* 安全区兜底：没有刘海 / 手势条时退化为固定留白，保证内容永远不贴边。 */
        --shell-gap: 20px;
        --safe-top: max(var(--shell-gap), env(safe-area-inset-top, 0px));
        --safe-right: max(var(--shell-gap), env(safe-area-inset-right, 0px));
        --safe-bottom: max(var(--shell-gap), env(safe-area-inset-bottom, 0px));
        --safe-left: max(var(--shell-gap), env(safe-area-inset-left, 0px));

        /* 纵屏游戏壳宽度：PC 上也是"手机宽度"的舞台，不横向铺满。 */
        --shell-width: 420px;

        --color-bg: #0d0d0f;
        --color-panel: #141219;
        --color-panel-soft: #1b1820;
        --color-border: #2a2520;
        --color-border-gold: #6b5a2f;
        --color-gold: #c9a84c;
        --color-gold-light: #e8d282;
        --color-text: #e6dcc1;
        --color-text-dim: #a09880;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        max-width: 100vw;
        overflow-x: hidden;
      }

      html {
        background: var(--color-bg);
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom)
          var(--safe-left);
        background:
          radial-gradient(
            circle at 50% 18%,
            rgba(201, 168, 76, 0.12),
            transparent 46%
          ),
          var(--color-bg);
        color: var(--color-text);
        font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }

      .offline-shell {
        width: 100%;
        max-width: var(--shell-width);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .offline-card {
        width: 100%;
        border: 1px solid var(--color-border);
        border-radius: 16px;
        padding: 22px 20px;
        background: linear-gradient(
          180deg,
          rgba(26, 23, 20, 0.96) 0%,
          rgba(14, 13, 16, 0.98) 100%
        );
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(240, 248, 255, 0.05);
        overflow: hidden;
      }

      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--color-border-gold);
        background: rgba(201, 168, 76, 0.1);
        color: var(--color-gold-light);
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .offline-badge__dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--color-gold);
        animation: offlinePulse 1.6s ease-in-out infinite;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: 21px;
        line-height: 1.3;
        color: var(--color-gold-light);
        overflow-wrap: anywhere;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: var(--color-text-dim);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .offline-status {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 11px;
        border-radius: 10px;
        border: 1px solid rgba(64, 76, 110, 0.72);
        background: var(--color-panel-soft);
        color: #bfc9e4;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .offline-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .offline-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid #3b332a;
        border-radius: 12px;
        background: #1c1917;
        color: var(--color-gold);
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }

      .offline-button--primary {
        border-color: #8d6f2c;
        background: linear-gradient(180deg, #d8bb63 0%, #b28f3c 100%);
        color: #1a1408;
        font-weight: 600;
      }

      .offline-button:disabled {
        opacity: 0.72;
        cursor: wait;
      }

      .offline-tips {
        width: 100%;
        border: 1px solid var(--color-border);
        border-radius: 14px;
        padding: 14px 16px;
        background: rgba(16, 16, 19, 0.72);
      }

      .offline-tips__title {
        color: var(--color-text-dim);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .offline-tips ul {
        margin: 0;
        padding-left: 18px;
      }

      .offline-tips li {
        color: #8f8874;
        font-size: 12px;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }

      /* 宽屏不横向拉伸：仍是纵屏舞台，只在必要时缩小外卡片宽度。 */
      @media (min-width: 768px) {
        body {
          padding-left: max(32px, env(safe-area-inset-left, 0px));
          padding-right: max(32px, env(safe-area-inset-right, 0px));
        }
      }

      @keyframes offlinePulse {
        0%,
        100% {
          opacity: 0.32;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .offline-badge__dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="offline-shell">
      <section class="offline-card" role="status" aria-live="polite">
        <span class="offline-badge">
          <span class="offline-badge__dot" aria-hidden="true"></span>
          灵脉未通
        </span>
        <h1>暂时无法感应到此方天地</h1>
        <p>
          当前与灵虚界的灵气通道中断，地图与战斗数据无法同步。待通道恢复后可直接继续此前行程，已发生的修为、物品与机缘不会丢失。
        </p>
        <div class="offline-status">
          <span aria-hidden="true">◍</span>
          <span id="offline-status-text">正在等待灵气通道恢复…</span>
        </div>
      </section>

      <section class="offline-card offline-actions">
        <button
          id="offline-retry-button"
          class="offline-button offline-button--primary"
          type="button"
        >
          尝试重新感应
        </button>
        <a class="offline-button" href="/game/map">返回此方地图</a>
      </section>

      <section class="offline-tips">
        <div class="offline-tips__title">可先确认以下几点</div>
        <ul>
          <li>确认设备已连接网络，或切换 Wi-Fi 与移动数据后重试。</li>
          <li>若处于电梯、地铁等信号薄弱处，移动到信号较好处再试。</li>
          <li>若仍无法连接，请等待片刻后再回到此页尝试。</li>
        </ul>
      </section>
    </main>

    <script>
      (function () {
        var statusText = document.getElementById("offline-status-text");
        var retryButton = document.getElementById("offline-retry-button");
        var checking = false;

        function setStatus(text) {
          if (statusText) {
            statusText.textContent = text;
          }
        }

        function tryReload() {
          if (checking) {
            return;
          }
          checking = true;
          if (retryButton) {
            retryButton.disabled = true;
          }
          setStatus("正在尝试重新感应…");
          // no-store 探测：确保拿到的是最新部署，而不是离线缓存副本。
          fetch("/game/map", { method: "GET", cache: "no-store" })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("still_offline");
              }
              window.location.reload();
            })
            .catch(function () {
              checking = false;
              if (retryButton) {
                retryButton.disabled = false;
              }
              setStatus("灵气通道仍未恢复，请稍后再试。");
            });
        }

        if (retryButton) {
          retryButton.addEventListener("click", tryReload);
        }
        // 回到前台 / 网络恢复都主动重试一次，避免玩家卡在离线页手动刷新。
        window.addEventListener("online", tryReload);
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            tryReload();
          }
        });
        window.addEventListener("pageshow", function (event) {
          if (event.persisted) {
            tryReload();
          }
        });

        if (navigator.onLine === false) {
          setStatus("设备当前处于离线状态。");
        }
      })();
    </script>
  </body>
</html>
